<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Romania SMP</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
            color: white;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
        }
        h2 { margin: 0 0 10px 0; color: #f39c12; }
    </style>
    <!-- Încărcăm Three.js din CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="info">
        <h2>ROMANIA SMP</h2>
        <p>Joc pornit!</p>
        <p>Folosește tastele <b>W, A, S, D</b> pentru mișcare.</p>
    </div>

    <script>
        // --- CLASA PLAYER ---[cite: 3]
        class Player {
            constructor() {
                this.position = new THREE.Vector3(0, 0.5, 0);
                this.speed = 5;
                
                // Creăm reprezentarea vizuală (un cub albastru)
                const geometry = new THREE.BoxGeometry(1, 1, 1);
                const material = new THREE.MeshBasicMaterial({ color: 0x3498db });
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.copy(this.position);
            }

            update(deltaTime, keys, bounds) {
                let movement = new THREE.Vector3(0, 0, 0);

                if (keys['KeyW']) movement.z -= 1;
                if (keys['KeyS']) movement.z += 1;
                if (keys['KeyA']) movement.x -= 1;
                if (keys['KeyD']) movement.x += 1;

                if (movement.length() > 0) {
                    movement.normalize();
                    this.position.addScaledVector(movement, this.speed * deltaTime);
                    this.mesh.position.copy(this.position);
                }
            }
        }

        // --- CLASA NPC ---[cite: 2]
        class NPC {
            constructor(position) {
                this.position = position;
                this.speed = 1.5;

                // Creăm reprezentarea vizuală (un cub roșu)
                const geometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
                const material = new THREE.MeshBasicMaterial({ color: 0xe74c3c });
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.copy(this.position);
            }

            update(deltaTime) {
                this.position.x += this.speed * deltaTime;

                if (this.position.x > 20) {
                    this.position.x = -20;
                }

                this.mesh.position.copy(this.position);
            }
        }

        // --- CLASA CAMERA ---[cite: 1]
        class CameraSystem {
            constructor(threeCamera) {
                this.camera = threeCamera;
                this.distance = 6;
                this.height = 3;
            }

            follow(playerPosition) {
                this.camera.position.set(
                    playerPosition.x,
                    playerPosition.y + this.height,
                    playerPosition.z + this.distance
                );
                this.camera.lookAt(playerPosition);
            }
        }

        // --- CLASA WORLD ---[cite: 5]
        class World {
            constructor(scene) {
                this.scene = scene;
                this.player = new Player();
                this.scene.add(this.player.mesh);

                this.npcs = [];
                for (let i = 0; i < 10; i++) {
                    let npc = new NPC(new THREE.Vector3(i * 3 - 15, 0.4, 5));
                    this.npcs.push(npc);
                    this.scene.add(npc.mesh);
                }

                // Podea simplă pentru orientare
                const floorGeo = new THREE.PlaneGeometry(50, 50);
                const floorMat = new THREE.MeshBasicMaterial({ color: 0x27ae60, side: THREE.DoubleSide });
                const floor = new THREE.Mesh(floorGeo, floorMat);
                floor.rotation.x = Math.PI / 2;
                floor.position.y = -0.5;
                this.scene.add(floor);
            }

            update(deltaTime, keys) {
                this.player.update(deltaTime, keys);

                for (let npc of this.npcs) {
                    npc.update(deltaTime);
                }
            }
        }

        // --- CONFIGURARE SCENĂ THREE.JS & GAME LOOP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const world = new World(scene);
        const cameraSystem = new CameraSystem(camera);

        // Gestionare taste apăsate
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // Bucla principală de joc (Game Loop)
        let lastTime = performance.now();

        function animate(currentTime) {
            requestAnimationFrame(animate);

            let deltaTime = (currentTime - lastTime) / 1000;
            if (deltaTime > 0.1) deltaTime = 0.016; // Limitare pentru siguranță
            lastTime = currentTime;

            // Actualizare lume și cameră[cite: 1, 5]
            world.update(deltaTime, keys);
            cameraSystem.follow(world.player.position);

            renderer.render(scene, camera);
        }

        requestAnimationFrame(animate);

        // Responsivitate la redimensionarea ferestrei
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
