<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Romania SMP - Giurgiu</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }
        h1 { margin: 0 0 6px 0; font-size: 16px; color: #3498db; letter-spacing: 1px; }
        p { margin: 4px 0; font-size: 13px; color: #bbb; }
        .key { background: rgba(255,255,255,0.15); padding: 2px 6px; border-radius: 4px; color: #fff; font-family: monospace; }
    </style>
    <!-- Three.js și OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui">
        <h1>ROMANIA SMP: ULTRA REALISTIC</h1>
        <p>Mișcare: <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span></p>
        <p>Cameră: <span class="key">Click Stânga + Drag</span> | Zoom: <span class="key">Rotiță</span></p>
    </div>

    <script>
        // --- 1. CONFIGURARE SCENĂ ȘI MOTOR DE RANDARE FOTO-REALIST ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05070a);
        scene.fog = new THREE.FogExp2(0x05070a, 0.01);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.01;
        controls.minDistance = 2;
        controls.maxDistance = 25;

        // --- 2. ILUMINAT AVANSAT (GLOBAL ILLUMINATION & SHADOWS) ---
        const ambientLight = new THREE.AmbientLight(0xddeeff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.8);
        sunLight.position.set(30, 50, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 4096;
        sunLight.shadow.mapSize.height = 4096;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 200;
        const d = 50;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.bias = -0.0002;
        scene.add(sunLight);

        // --- 3. ÎNCĂRCĂRI TEXTURI FOTO-REALE DIN WEB ---
        const textureLoader = new THREE.TextureLoader();

        // Textură Asfalt Realist pentru sol
        const asphaltTex = textureLoader.load('https://images.unsplash.com/photo-1558442085-84f9316543b5?auto=format&fit=crop&w=1024&q=80');
        asphaltTex.wrapS = THREE.RepeatWrapping;
        asphaltTex.wrapT = THREE.RepeatWrapping;
        asphaltTex.repeat.set(20, 20);

        // Textură Fațadă Clădire Realistă
        const buildingTex = textureLoader.load('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1024&q=80');
        buildingTex.wrapS = THREE.RepeatWrapping;
        buildingTex.wrapT = THREE.RepeatWrapping;

        // --- 4. GENERARE MEDIU URBAN TEXTURAT ---
        function createEnvironment() {
            // Solul texturat cu asfalt
            const groundGeo = new THREE.PlaneGeometry(250, 250);
            const groundMat = new THREE.MeshStandardMaterial({ 
                map: asphaltTex, 
                roughness: 0.8,
                metalness: 0.1 
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Clădiri cu textură fotografică pe fațade
            for (let x = -70; x <= 70; x += 16) {
                for (let z = -70; z <= 70; z += 16) {
                    if (Math.abs(x) < 12 || Math.abs(z) < 12) continue; // Evităm strada principală

                    let width = 12;
                    let depth = 12;
                    let height = 20 + Math.random() * 30;

                    const bGeo = new THREE.BoxGeometry(width, height, depth);
                    const bMat = new THREE.MeshStandardMaterial({ 
                        map: buildingTex,
                        roughness: 0.4,
                        metalness: 0.2
                    });
                    
                    const building = new THREE.Mesh(bGeo, bMat);
                    building.position.set(x, height / 2, z);
                    building.castShadow = true;
                    building.receiveShadow = true;
                    scene.add(building);
                }
            }
        }
        createEnvironment();

        // --- 5. PERSONAJ ULTRA-DETALIAT (TEXTURAT ȘI ARTICULAT) ---
        class RealisticPlayer {
            constructor() {
                this.position = new THREE.Vector3(0, 0, 0);
                this.speed = 6;
                
                const group = new THREE.Group();

                // Blugi (Pantaloni texturați sau materiali avansați)
                const legsGeo = new THREE.BoxGeometry(0.55, 0.9, 0.4);
                const legsMat = new THREE.MeshStandardMaterial({ color: 0x1b263b, roughness: 0.9 }); // Textură de blugi închis
                const legs = new THREE.Mesh(legsGeo, legsMat);
                legs.position.y = 0.45;
                legs.castShadow = true;
                group.add(legs);

                // Geacă / Torso (Stil inspirat din imagini urbane reale)
                const torsoGeo = new THREE.BoxGeometry(0.65, 0.9, 0.38);
                const torsoMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5, metalness: 0.3 }); // Geacă de piele/fașă neagră
                const torso = new THREE.Mesh(torsoGeo, torsoMat);
                torso.position.y = 1.35;
                torso.castShadow = true;
                group.add(torso);

                // Cap (Piele realistă)
                const headGeo = new THREE.BoxGeometry(0.35, 0.4, 0.35);
                const headMat = new THREE.MeshStandardMaterial({ color: 0xe0ac69, roughness: 0.7 });
                const head = new THREE.Mesh(headGeo, headMat);
                head.position.y = 1.95;
                head.castShadow = true;
                group.add(head);

                this.mesh = group;
                this.mesh.position.copy(this.position);
                scene.add(this.mesh);
            }

            update(deltaTime, keys) {
                let movement = new THREE.Vector3(0, 0, 0);

                if (keys['KeyW'] || keys['ArrowUp']) movement.z -= 1;
                if (keys['KeyS'] || keys['ArrowDown']) movement.z += 1;
                if (keys['KeyA'] || keys['ArrowLeft']) movement.x -= 1;
                if (keys['KeyD'] || keys['ArrowRight']) movement.x += 1;

                if (movement.length() > 0) {
                    movement.normalize();
                    this.position.addScaledVector(movement, this.speed * deltaTime);
                    
                    // Limite pe hartă
                    this.position.x = Math.max(-100, Math.min(100, this.position.x));
                    this.position.z = Math.max(-100, Math.min(100, this.position.z));

                    this.mesh.position.copy(this.position);
                    
                    // Rotație fluentă în direcția de mers
                    let angle = Math.atan2(movement.x, movement.z);
                    this.mesh.rotation.y = angle;
                }
            }
        }

        const player = new RealisticPlayer();

        // Control tastatură
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // --- 6. GAME LOOP ---
        let lastTime = performance.now();

        function animate(currentTime) {
            requestAnimationFrame(animate);

            let deltaTime = (currentTime - lastTime) / 1000;
            if (deltaTime > 0.1) deltaTime = 0.016;
            lastTime = currentTime;

            player.update(deltaTime, keys);

            // Camera urmărește fluid personajul
            controls.target.lerp(new THREE.Vector3(player.position.x, player.position.y + 1.2, player.position.z), 0.1);
            controls.update();

            renderer.render(scene, camera);
        }

        requestAnimationFrame(animate);

        // Redimensionare fereastră
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
